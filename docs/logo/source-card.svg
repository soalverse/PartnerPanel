<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#333"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <path id="heart" d="M0,95 C-75,45 -100,-5 -70,-45 C-45,-75 -10,-65 0,-35 C10,-65 45,-75 70,-45 C100,-5 75,45 0,95 Z"/>
  </defs>
  <rect width="480" height="480" fill="#000"/>
  <circle cx="240" cy="240" r="230" fill="url(#glow)"/>
  <!-- the card -->
  <rect x="40" y="130" width="400" height="220" rx="28" fill="#000" stroke="#fff" stroke-width="14"/>
  <rect x="54" y="144" width="372" height="192" rx="18" fill="#2a2a2a"/>
  <!-- icon slot with a heart -->
  <rect x="72" y="166" width="120" height="120" rx="16" fill="#000"/>
  <use href="#heart" transform="translate(132 220) scale(0.55)" fill="#fff"/>
  <!-- name / zone / status lines -->
  <rect x="214" y="172" width="190" height="30" rx="15" fill="#fff"/>
  <rect x="214" y="218" width="150" height="22" rx="11" fill="#9a9a9a"/>
  <rect x="214" y="256" width="110" height="22" rx="11" fill="#9a9a9a"/>
  <!-- health bar -->
  <rect x="72" y="304" width="336" height="16" rx="8" fill="#555"/>
  <rect x="72" y="304" width="250" height="16" rx="8" fill="#fff"/>
</svg>
